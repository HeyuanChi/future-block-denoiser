data:
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  tokenizer_name: roberta-base
  prefix_len: 64
  future_len: 16
  stride: 16
  batch_size: 64
  num_workers: 0
  max_train_samples: 1024
  max_val_samples: 256

model:
  bert_name: roberta-base
  prefix_len: 64
  future_len: 16
  coarse_slots: 4
  latent_dim: 256
  predictor_mode: cvae
  plan_latent_dim: 512
  slot_refinement: causal_residual
  slot_refinement_layers: 1
  slot_refinement_scale: 0.25
  predictor_layers: 2
  predictor_heads: 8
  predictor_ffn_dim: 1024
  predictor_dropout: 0.1

training:
  ae_checkpoint_path: outputs/checkpoints/ae_four_slot_causal_refine_roberta/ae_best.pt
  predictor_checkpoint_path: outputs/checkpoints/four_slot_predictor_cvae_plan512_overfit_roberta/predictor_best.pt
  learning_rate: 0.0002
  weight_decay: 0.0
  num_epochs: 100
  device: auto
  log_every: 20
  checkpoint_dir: outputs/checkpoints/four_slot_predictor_cvae_plan512_overfit_roberta
  log_dir: outputs/logs/four_slot_predictor_cvae_plan512_overfit_roberta
  save_every_epoch: false
  grad_clip_norm: 1.0
  decode_loss_weight: 0.0
  kl_weight: 0.01
  kl_warmup_epochs: 10
